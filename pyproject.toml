[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tw-intraday-trader"
version = "0.1.0"
description = "台股盤中即時選股與交易決策系統 MVP"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115,<1",
    "python-dotenv>=1.0",
    "uvicorn>=0.30,<1",
    "websockets>=13,<17",
]

[project.optional-dependencies]
broker = [
    "shioaji>=1.7,<2",
]
dev = [
    "httpx2>=2,<3",
    "mypy==2.3.1",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.16.3",
]
postgres = [
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["market_data*", "candidate*", "scoring*", "position*", "config*", "dashboard*", "runtime*", "simulation*", "signals*", "trading*", "features*", "backtest*", "strategy_catalog*", "atomic_strategies*", "premarket*", "institutional_data*", "institutional_research*", "institutional_prior*", "institutional_mvp*", "watchlist*"]

[tool.setuptools.package-data]
trading = ["migrations/*.sql"]
backtest = ["migrations/*.sql"]
institutional_prior = ["migrations/*.sql"]
config = ["taifex_calendar_2026.json", "twse_calendar_2026.json"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "build", "data", "records", "research", ".planning"]

[tool.ruff.lint]
select = ["F", "E9"]

[tool.ruff.lint.isort]
known-first-party = [
    "app",
    "atomic_strategies",
    "backtest",
    "candidate",
    "config",
    "dashboard",
    "features",
    "institutional_data",
    "institutional_mvp",
    "institutional_prior",
    "institutional_research",
    "market_data",
    "position",
    "premarket",
    "runtime",
    "scoring",
    "signals",
    "simulation",
    "strategy_catalog",
    "trading",
    "watchlist",
]

[tool.mypy]
python_version = "3.11"
files = ["signals", "features", "atomic_strategies"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["signals.*", "features.*", "atomic_strategies.*"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["market_data.*"]
follow_imports = "silent"
