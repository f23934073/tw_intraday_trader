name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint with Ruff
        run: python -m ruff check .

      - name: Check formatting with Ruff (non-blocking)
        run: python -m ruff format --check .
        continue-on-error: true

      - name: Type-check contract packages
        run: python -m mypy

      - name: Compile Python packages
        run: >-
          python -m compileall -q
          app.py backtest candidate config dashboard features market_data position runtime
          scoring signals simulation strategy_catalog trading scripts tests

      - name: Check dashboard JavaScript syntax
        run: python scripts/check_dashboard_js.py

      - name: Check planning document consistency
        run: python scripts/check_planning_consistency.py

      - name: Run tests with MockProvider-compatible defaults
        run: python -m pytest tests/ -q

      - name: Check whitespace errors
        run: git diff --check

  postgres-journal:
    name: PostgreSQL Journal
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tw_intraday_trader_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tw_intraday_trader_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/tw_intraday_trader_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL test dependencies
        run: python -m pip install -e ".[dev,postgres]"

      - name: Run PostgreSQL durability tests
        run: >-
          python -m pytest
          tests/test_journal.py
          tests/test_local_paper_projection.py
          tests/test_postgres_journal.py
          tests/test_kill_switch_postgres.py
          tests/test_local_paper_postgres.py
          tests/test_no_overnight_postgres_guard_uat.py
          tests/test_no_overnight_postgres_runtime_uat.py
          tests/test_phase5_paper_sell_postgres_uat.py
          -q
